<!-- 
  TIBYAN PRINT SERVICE v2.0
  modals.html - Modals & Dialogs Component Template (Update Status, Report Trouble, User Management)
-->
<div>
  <!-- Modal Update Status Manual (Admin Only) -->
  <div id="modal-update-status" class="modal-overlay">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-family: var(--font-heading); font-size: 18px;">Ubah Status Permohonan</h3>
        <button type="button" style="background: none; border: none; font-size: 20px; cursor: pointer;" onclick="UIModule.closeModal('modal-update-status')">&times;</button>
      </div>

      <input type="hidden" id="modal-status-req-id">

      <div class="form-group">
        <label class="form-label">Nomor Antrean</label>
        <input type="text" id="modal-status-req-display" class="form-control" readonly style="background: var(--surface-variant);">
      </div>

      <div class="form-group">
        <label class="form-label">Pilih Status Baru <span class="required">*</span></label>
        <select id="modal-status-select" class="form-control">
          <option value="WAITING">WAITING (Menunggu Verifikasi)</option>
          <option value="VERIFIED">VERIFIED (Telah Terverifikasi)</option>
          <option value="PRINTING">PRINTING (Sedang Dicetak)</option>
          <option value="READY">READY (Siap Diambil)</option>
          <option value="COMPLETED">COMPLETED (Selesai)</option>
          <option value="REJECTED">REJECTED (Bermasalah / Ditolak)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Catatan Sekretariat / Alasan Update</label>
        <textarea id="modal-status-notes" class="form-control" rows="3" placeholder="Masukkan catatan update..."></textarea>
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
        <button type="button" class="btn btn-secondary" onclick="UIModule.closeModal('modal-update-status')">Batal</button>
        <button type="button" class="btn btn-primary" onclick="StatusModule.submitStatusUpdate()">Simpan Perubahan</button>
      </div>
    </div>
  </div>

  <!-- Modal Laporkan Trouble / Kendala Cetak (Admin Only) -->
  <div id="modal-report-trouble" class="modal-overlay">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-family: var(--font-heading); font-size: 18px; color: var(--danger);">⚠️ Laporkan Kendala / Trouble Cetak</h3>
        <button type="button" style="background: none; border: none; font-size: 20px; cursor: pointer;" onclick="UIModule.closeModal('modal-report-trouble')">&times;</button>
      </div>

      <input type="hidden" id="trouble-req-id">

      <div class="form-group">
        <label class="form-label">Nomor Antrean Kendala</label>
        <input type="text" id="trouble-req-display" class="form-control" readonly style="background: var(--surface-variant); font-weight: 700;">
      </div>

      <div class="form-group">
        <label class="form-label">Pilih Jenis Kendala / Masalah <span class="required">*</span></label>
        <select id="trouble-preset-select" class="form-control" onchange="StatusModule.handleTroublePresetChange(this.value)">
          <option value="Tinta / Toner Printer Habis">Tinta / Toner Printer Habis</option>
          <option value="Stok Kertas (A4/F4/A5) Habis">Stok Kertas (A4/F4/A5) Habis</option>
          <option value="File Dokumen Terkunci / Corrupt / Password">File Dokumen Terkunci / Corrupt / Password</option>
          <option value="Printer Macet (Paper Jam) / Error Mesin">Printer Macet (Paper Jam) / Error Mesin</option>
          <option value="Ukuran Kertas Tidak Sesuai Spesifikasi">Ukuran Kertas Tidak Sesuai Spesifikasi</option>
          <option value="CUSTOM">Lainnya (Ketik sendiri di bawah...)</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Penjelasan Kendala / Catatan untuk Pemohon <span class="required">*</span></label>
        <textarea id="trouble-custom-notes" class="form-control" rows="3" placeholder="Jelaskan detail kendala...">Tinta / Toner Printer Habis</textarea>
      </div>

      <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
        <button type="button" class="btn btn-secondary" onclick="UIModule.closeModal('modal-report-trouble')">Batal</button>
        <button type="button" class="btn btn-danger" onclick="StatusModule.submitTroubleReport()">Simpan Kendala (Set Status REJECTED)</button>
      </div>
    </div>
  </div>

  <!-- Modal User Management (Admin Only) -->
  <div id="modal-manage-users" class="modal-overlay">
    <div class="modal-box" style="max-width: 640px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-family: var(--font-heading); font-size: 18px;">Manajemen Pengguna Aplikasi</h3>
        <button type="button" style="background: none; border: none; font-size: 20px; cursor: pointer;" onclick="UIModule.closeModal('modal-manage-users')">&times;</button>
      </div>

      <form id="form-user-save" onsubmit="UserModule.handleUserSaveSubmit(event)" style="background: var(--surface-variant); padding: 16px; border-radius: var(--radius-sm); margin-bottom: 20px;">
        <div style="font-weight: 700; font-size: 13px; margin-bottom: 10px;">Tambah / Edit Pengguna</div>
        
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
          <div>
            <label class="form-label">Email Google <span class="required">*</span></label>
            <input type="email" id="u-form-email" class="form-control" required placeholder="user@gmail.com">
          </div>

          <div>
            <label class="form-label">Nama Lengkap <span class="required">*</span></label>
            <input type="text" id="u-form-name" class="form-control" required placeholder="Nama Pengguna">
          </div>

          <div>
            <label class="form-label">Role Akses <span class="required">*</span></label>
            <select id="u-form-role" class="form-control">
              <option value="USER">USER (Guru / Staff)</option>
              <option value="ADMIN">ADMIN (Sekretariat)</option>
              <option value="VIEWER">VIEWER (Kepala Sekolah)</option>
            </select>
          </div>

          <div>
            <label class="form-label">Unit / Departemen</label>
            <input type="text" id="u-form-dept" class="form-control" placeholder="Pengajar SD/SMP">
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; margin-top: 12px;">
          <button type="submit" class="btn btn-primary btn-sm">Simpan Pengguna</button>
        </div>
      </form>

      <div id="users-table-container">
        <div style="text-align: center; padding: 20px;">Memuat pengguna...</div>
      </div>
    </div>
  </div>
</div>
